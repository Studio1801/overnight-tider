<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Owner dashboard | Overnight Tider</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13202e">
<link rel="icon" href="brand/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13202e;--ink-2:#1b2c3e;--ink-3:#2a4058;
  --ice:#eef3f2;--ice-2:#dfe8e6;--paper:#f7f6f1;
  --sign:#2f6b3d;--sign-dk:#24552f;--sign-lt:#9cc8a5;
  --band:#f2c230;--shell:#b9441d;
  --line:#e3e6e1;--muted:#5d6b75;--body:#33414d;
  --f-display:"Big Shoulders Display",Impact,sans-serif;--f-body:"Instrument Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.2px}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px;line-height:1.2;text-decoration:none;white-space:nowrap;transition:background-color .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-green{background:var(--sign);color:#fff}.b-green:hover{background:var(--sign-dk)}
.b-ink{background:var(--ink);color:#fff}.b-ink:hover{background:var(--ink-3)}
.b-band{background:var(--band);color:var(--ink)}.b-band:hover{background:#e3b31f}
.b-soft{background:var(--ice);color:var(--ink)}.b-soft:hover{background:var(--ice-2)}
.b-ghost{background:none;color:var(--muted);padding:11px 12px}.b-ghost:hover{color:var(--ink)}
.b-sm{padding:8px 14px;font-size:14px}
.lnk{background:none;border:0;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--band);text-decoration-thickness:2px;text-underline-offset:4px}

/* lock screen */
.lock{min-height:100vh;display:grid;place-items:center;background:var(--ink);color:#fff;padding:24px;position:relative;overflow:hidden}
.lock-bg{position:absolute;inset:0;background:url(img/crate.webp) center/cover;opacity:.16;filter:saturate(.7)}
.lock-card{position:relative;width:min(400px,100%);text-align:center}
.lock-card img{width:56px;height:56px;margin:0 auto 18px}
.lock h1{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:.9;margin:0;transform:skewX(-8deg);color:#fff}
.lock p{margin:10px 0 28px;color:#b9c6d1}
.pin{display:flex;justify-content:center;gap:10px}
.pin input{width:58px;height:68px;border-radius:14px;border:0;background:rgba(255,255,255,.1);color:#fff;text-align:center;font-family:var(--f-display);font-weight:800;font-size:34px;caret-color:var(--band);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:box-shadow .2s,background-color .2s}
.pin input:focus{outline:none;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px var(--band)}
.pin.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lock-msg{min-height:24px;margin-top:14px;font-size:14px;color:#ffd7cb}
.demo-hint{display:inline-block;margin-top:22px;font-size:13.5px;color:var(--ink);background:var(--band);border-radius:999px;padding:6px 14px;font-weight:600}

/* shell */
.app{display:grid;min-height:100vh}
.side{display:none}
.main{min-width:0;padding-bottom:110px}
.top{position:sticky;top:0;z-index:20;background:rgba(247,246,241,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:14px 18px;max-width:1240px;margin:0 auto}
.top-mark{width:32px;height:32px}
.top h1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;margin:0;letter-spacing:.2px;white-space:nowrap}
@media (max-width:520px){.top h1{white-space:normal;text-wrap:balance;font-size:27px;min-width:0}.top-act .btn{padding:8px 12px;font-size:13px}.top-act .hide-m{display:none}}
.top .when{font-size:13px;color:var(--muted);display:none}
.top-act{margin-left:auto;display:flex;gap:8px;align-items:center}
.page{max-width:1240px;margin:0 auto;padding:20px 18px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{position:relative;background:none;border:0;color:#9fb0bd;font-size:11.5px;font-weight:600;padding:8px 2px;border-radius:10px;display:grid;justify-items:center;gap:3px}
.tabbar button svg{width:20px;height:20px}
.tabbar button[aria-current="true"]{color:#fff;background:rgba(255,255,255,.08)}
.tabbar .ct{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--band);color:var(--ink);font-size:11px;line-height:18px;padding:0 5px}
@media (min-width:980px){
  .app{grid-template-columns:248px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--ink);color:#c3cfd8;padding:22px 14px 18px}
  .tabbar,.top-mark{display:none}
  .top-in{padding:22px 40px 18px}
  .top h1{font-size:40px}
  .top .when{display:block}
  .page{padding:28px 40px}
  .main{padding-bottom:60px}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08);text-decoration:none}
.brand img{width:34px;height:34px}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1;color:#fff;transform:skewX(-8deg)}
.brand small{display:block;font-size:12px;color:#8fa1b0;margin-top:3px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#c3cfd8;text-align:left;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:500;transition:background-color .15s,color .15s}
.nav button svg{width:18px;height:18px;opacity:.75}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="true"]{background:rgba(255,255,255,.1);color:#fff}
.nav button[aria-current="true"] svg{opacity:1;color:var(--band)}
.nav .ct{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--band);color:var(--ink);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 7px}
.side-foot{margin-top:auto;display:grid;gap:4px}
.side-foot a,.side-foot button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#9fb0bd;padding:9px 12px;border-radius:10px;font-size:14px;text-decoration:none;text-align:left}
.side-foot a:hover,.side-foot button:hover{color:#fff;background:rgba(255,255,255,.06)}
.mode{margin:0 0 10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px;line-height:1.45}
.mode b{display:flex;align-items:center;gap:8px;color:#fff;font-size:13.5px}
.mode b i{width:8px;height:8px;border-radius:50%;background:var(--band)}
.mode.live b i{background:#7fd08f}

/* cards and common */
.card{background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 20px 6px}
.card-h h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;margin:0;letter-spacing:.2px}
.card-h a,.card-h button{font-size:14px}
.card-b{padding:8px 20px 20px}
.grid2{display:grid;gap:18px}
@media (min-width:1100px){.grid2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.stack{display:grid;gap:18px}
.note-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--ink);color:#d3dde5;border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.note-bar b{color:#fff}
.note-bar .lnk{color:#fff}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(2,1fr)}
.kpi{padding:18px 20px;border-top:1px solid var(--line)}
.kpi:nth-child(-n+2){border-top:0}
.kpi:nth-child(2n){border-left:1px solid var(--line)}
.kpi span{display:block;font-size:13.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi small.up{color:var(--sign)}
.kpi small.dn{color:var(--shell)}
.kpi.hot b{color:var(--shell)}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}.kpi{border-top:0}.kpi+.kpi{border-left:1px solid var(--line)}.kpis.k5{grid-template-columns:repeat(5,1fr)}}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{background:#fff3cc;color:#7a5a00}
.s-sent{background:var(--ice);color:var(--ink-3)}
.s-confirmed{background:#e3ecf7;color:#24466b}
.s-paid{background:#e2efe5;color:var(--sign-dk)}
.s-done{background:#eef0ee;color:var(--muted)}
.s-cancelled{background:#f6e7e2;color:var(--shell)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--ice);color:var(--ink-3)}
.tag.ws{background:var(--ink);color:#fff}
.tag.code{background:var(--band);color:var(--ink)}

/* rows (inbox style) */
.rows{list-style:none;margin:0;padding:0}
.rows li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 20px;background:none;border:0;width:100%;text-align:left;transition:background-color .15s}
button.row:hover{background:#fafaf7}
.row b{font-weight:600;font-size:15.5px}
.row .sub{grid-column:1;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{grid-row:1/3;grid-column:2;display:grid;justify-items:end;gap:6px}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums}

/* orders table */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg{display:flex;gap:4px;background:#fff;border-radius:999px;padding:4px;box-shadow:0 0 0 1px var(--line);overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{background:none;border:0;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background-color .15s,color .15s}
.seg button span{font-weight:500;font-size:12.5px;color:#97a3ab}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button[aria-pressed="true"] span{color:#b9c6d1}
.search{flex:1 1 220px;max-width:360px;position:relative}
.search input{width:100%;border:0;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--line);padding:10px 16px 10px 40px;font-size:14.5px}
.search input:focus{outline:none;box-shadow:0 0 0 2px var(--sign)}
.search svg{position:absolute;left:14px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background-color .12s}
.tbl tbody tr:hover{background:#fafaf7}
.tbl td.mono{white-space:nowrap}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .who b{display:block;font-weight:600}
.tbl .who small{color:var(--muted);font-size:13px}
.tbl .its{max-width:320px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl tr.isnew td:first-child{box-shadow:inset 3px 0 0 var(--band)}
.ocards{display:none}
@media (max-width:820px){.tbl-wrap{display:none}.ocards{display:block}}

/* drawer */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(19,32,46,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:51;width:min(560px,100%);background:var(--paper);box-shadow:-30px 0 60px -30px rgba(19,32,46,.5);transform:translateX(100%);visibility:hidden;transition:transform .35s var(--ease),visibility 0s .35s;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;transition:transform .35s var(--ease)}
.dr-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
.dr-h .mono{font-size:15px;font-weight:500}
.dr-x{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--ice);font-size:22px;line-height:1}
.dr-b{flex:1;overflow:auto;padding:18px 20px 30px;display:grid;grid-auto-rows:max-content;gap:16px;align-content:start;min-height:0}
.dr-f{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dr-f .btn{flex:1 1 auto}
.who-card{display:grid;gap:10px}
.who-card h3{margin:0;font-size:22px;font-weight:600;line-height:1.2}
.who-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--body)}
.who-meta span b{font-weight:600;color:var(--ink)}
.who-acts{display:flex;gap:8px;flex-wrap:wrap}
.memo{background:#fff8de;border-radius:10px;padding:10px 12px;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:2px 0}
.steps div{display:grid;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.steps div i{height:4px;border-radius:4px;background:var(--ice-2)}
.steps div.on{color:var(--ink);font-weight:600}
.steps div.on i{background:var(--sign)}
.steps small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:44px minmax(0,1fr) 104px 82px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.lines li:first-child{border-top:0}
.lines img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.lines .nm b{display:block;font-weight:600;font-size:15px;line-height:1.25}
.lines .nm small{color:var(--muted);font-size:13px}
.lines .lt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.money-in{position:relative}
.money-in::before{content:"$";position:absolute;left:10px;top:9px;color:var(--muted);font-size:14px}
.money-in input{width:100%;border:0;border-radius:8px;background:var(--ice);padding:8px 8px 8px 22px;font-size:14.5px;font-variant-numeric:tabular-nums}
.money-in input:focus{outline:none;box-shadow:0 0 0 2px var(--sign);background:#fff}
.money-in.sug input{color:var(--muted)}
.money-in small{position:absolute;right:0;top:100%;font-size:10.5px;color:var(--muted);white-space:nowrap}
.tot{padding:6px 16px 14px;display:grid;gap:8px;border-top:1px solid var(--line)}
.tot div{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14.5px}
.tot .money-in{width:104px}
.tot .grand{padding-top:10px;border-top:1px dashed var(--line)}
.tot .grand b{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.msg-box{display:grid;gap:8px}
.msg-box textarea{width:100%;min-height:150px;border:0;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--line);padding:12px 14px;font-size:14.5px;line-height:1.5;resize:vertical}
.msg-box textarea:focus{outline:none;box-shadow:0 0 0 2px var(--sign)}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.paidvia{display:flex;flex-wrap:wrap;gap:6px}
.paidvia button{border:0;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--line);padding:8px 14px;font-size:14px;font-weight:600}
.paidvia button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.log{list-style:none;margin:0;padding:0;font-size:13.5px;color:var(--muted);display:grid;gap:4px}
.log b{color:var(--ink);font-weight:600}
@media (max-width:520px){.lines li{grid-template-columns:40px minmax(0,1fr) 96px;row-gap:4px;padding:11px 14px}.lines .lt{grid-column:2/4;font-size:14px}.lines img{width:40px;height:40px}.money-in small{position:static;display:block;margin-top:3px}}

/* stock */
.publish{position:fixed;left:50%;bottom:86px;z-index:40;transform:translate(-50%,24px);opacity:0;visibility:hidden;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;box-shadow:0 20px 40px -14px rgba(19,32,46,.55);transition:transform .35s var(--ease),opacity .25s,visibility 0s .35s;max-width:calc(100% - 24px)}
.publish.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .35s var(--ease),opacity .25s}
@media (max-width:520px){.publish{left:12px;right:12px;transform:translateY(24px);padding-left:16px}.publish.on{transform:none}.publish span{white-space:normal;font-size:13.5px;flex:1}#pubUndo{display:none}}
.publish span{font-size:14.5px;white-space:nowrap}
.publish span b{color:var(--band)}
@media (min-width:980px){.publish{bottom:24px;left:calc(50% + 124px)}}
.sp{display:grid;gap:14px;padding:18px 20px 20px}
.sp-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sp-prev{background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px}
.sp-prev b{color:var(--band)}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:0;border-radius:10px;background:#fff;box-shadow:0 0 0 1px #d5dbd7;padding:10px 12px;font-size:15px}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;box-shadow:0 0 0 2px var(--sign)}
.field.chg input,.field.chg textarea{box-shadow:0 0 0 1.5px var(--band);background:#fffdf3}
.field .fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.field .rs{background:none;border:0;padding:0;font-size:12.5px;color:var(--muted);text-decoration:underline}
.f2{display:grid;gap:12px}
@media (min-width:640px){.f2{grid-template-columns:1fr 1fr}}
.sw{position:relative;width:46px;height:28px;flex:none;border:0;border-radius:999px;background:#c9d1d0;transition:background-color .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw[aria-checked="true"]{background:var(--sign)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sw-row{display:flex;align-items:center;gap:12px;font-weight:600}
.pp-acts{display:flex;flex-wrap:wrap;gap:8px}
.stk{list-style:none;margin:0;padding:0}
.stk>li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:16px 20px;border-top:1px solid var(--line)}
.stk>li:first-child{border-top:0}
.stk img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.stk.out-dim>li.is-out img{filter:grayscale(1);opacity:.6}
.stk-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.st3 button{white-space:nowrap}
@media (max-width:520px){.stk>li{grid-template-columns:44px minmax(0,1fr);gap:12px;padding:16px}.stk img{width:44px;height:44px}.st3{width:100%}.st3 button{flex:1;padding:7px 6px;font-size:13px}.stk-p .pf{width:calc(50% - 7px)}}
.stk-h b{font-size:16.5px;font-weight:600}
.st3{display:inline-flex;background:var(--ice);border-radius:999px;padding:3px}
.st3 button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted);transition:background-color .15s,color .15s}
.st3 button[aria-pressed="true"][data-st="in"]{background:var(--sign);color:#fff}
.st3 button[aria-pressed="true"][data-st="limited"]{background:var(--band);color:var(--ink)}
.st3 button[aria-pressed="true"][data-st="out"]{background:var(--ink);color:#fff}
.stk-p{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:12px;align-items:flex-end}
.stk-p .pf{display:grid;gap:4px;width:130px}
.stk-p .pf span{font-size:12.5px;color:var(--muted)}
.stk-more{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px;font-size:14px}
.stk-more label{display:inline-flex;align-items:center;gap:8px;color:var(--body)}
.stk-more input[type=checkbox]{width:18px;height:18px;accent-color:var(--sign)}
.cnt{display:inline-flex;align-items:center;gap:6px}
.cnt input{width:76px;border:0;border-radius:8px;background:var(--ice);padding:7px 10px;font-size:14.5px;text-align:right}
.cnt input:focus{outline:none;box-shadow:0 0 0 2px var(--sign);background:#fff}
.low{color:var(--shell);font-weight:600;font-size:13px}
.stk-note{margin-top:10px}
.stk-note input{width:100%;border:0;border-radius:8px;background:var(--ice);padding:8px 12px;font-size:14px}
.stk-note input:focus{outline:none;box-shadow:0 0 0 2px var(--sign);background:#fff}

/* website editor */
.ed{display:grid;gap:18px}
@media (min-width:1180px){.ed{grid-template-columns:440px minmax(0,1fr);align-items:start}.pv{position:sticky;top:110px}}
.grp{background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.grp+.grp{margin-top:12px}
.grp summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}
.grp summary::-webkit-details-marker{display:none}
.grp summary b{font-size:16px;font-weight:600}
.grp summary small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.grp summary i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ice);position:relative;transition:transform .3s var(--ease)}
.grp summary i::before{content:"";position:absolute;left:9px;top:8px;width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.grp[open] summary i{transform:rotate(180deg)}
.grp-b{display:grid;gap:14px;padding:4px 18px 20px}
.ph{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.ph-img{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--ice)}
.ph-img img{width:100%;height:100%;object-fit:cover}
.ph-img button{position:absolute;inset:auto 6px 6px 6px;border:0;border-radius:999px;background:rgba(19,32,46,.82);color:#fff;font-size:12px;font-weight:600;padding:5px 0}
.ph-img.chg{box-shadow:0 0 0 2px var(--band)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ph-grid figure{margin:0;display:grid;gap:6px}
.ph-grid .ph-img{width:100%;height:auto;aspect-ratio:1}
.ph-grid figcaption{font-size:13px;font-weight:600}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pv-bar b{font-size:14px;font-weight:600}
.pv-bar .seg button{padding:6px 12px;font-size:13px}
.pv-frame{position:relative;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line),0 30px 60px -40px rgba(19,32,46,.5);overflow:hidden;height:calc(100vh - 190px);min-height:520px}
.pv-frame iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:var(--paper)}
.pv-frame.phone{background:var(--ice);display:grid;place-items:center}
.pv-frame.phone iframe{position:relative;border-radius:22px;box-shadow:0 0 0 8px var(--ink)}
@media (max-width:1179px){.pv{display:none}.pv.full{display:block;position:fixed;inset:0;z-index:60;background:var(--paper);padding:12px}.pv.full .pv-frame{height:calc(100vh - 70px)}}
.pv-open{display:none}
@media (max-width:1179px){.pv-open{display:inline-flex}}

/* money */
.chart{position:relative;padding:6px 20px 18px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:#e9ece8;stroke-width:1}
.chart .ax{font-size:11.5px;fill:var(--muted);font-family:var(--f-body)}
.chart .bar{fill:var(--sign);transition:fill .15s}
.chart .bar.part{fill:var(--sign-lt)}
.chart .hit{fill:transparent;cursor:pointer}
.chart g.on .bar{fill:var(--ink)}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s}
.tip b{display:block;font-size:15px}
.hbars{list-style:none;margin:0;padding:6px 20px 18px;display:grid;gap:12px}
.hbars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14.5px}
.hbars li b{font-weight:600;font-variant-numeric:tabular-nums}
.hbars li i{grid-column:1/-1;height:8px;border-radius:8px;background:var(--ice)}
.hbars li i s{display:block;height:100%;border-radius:8px;background:var(--sign);text-decoration:none}
.split{padding:10px 20px 20px;display:grid;gap:14px}
.split-bar{display:flex;gap:2px;height:12px;border-radius:12px;overflow:hidden}
.split-bar s{display:block;text-decoration:none}
.split-l{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split-l div{display:grid;gap:2px}
.split-l span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.split-l span i{width:10px;height:10px;border-radius:3px}
.split-l b{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.split-l small{font-size:12.5px;color:var(--muted)}
.pays{list-style:none;margin:0;padding:0 20px 18px}
.pays li{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.pays li:first-child{border-top:0}
.pays b{font-weight:600;font-variant-numeric:tabular-nums}

/* toast */
.toast{position:fixed;left:50%;top:18px;z-index:80;transform:translate(-50%,-160%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 20px;font-size:14.5px;font-weight:500;box-shadow:0 18px 40px -14px rgba(19,32,46,.6);transition:transform .35s var(--ease);max-width:calc(100% - 24px)}
.toast.on{transform:translate(-50%,0)}
.toast b{color:var(--band)}
.more-sheet{display:grid;gap:10px}
.more-sheet button{display:flex;justify-content:space-between;align-items:center;background:#fff;border:0;border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:16px 18px;font-size:16px;font-weight:600;text-align:left}

/* ===== motion and simpler layout ===== */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.enter>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--n,0)*70ms)}
.app.in{animation:fadein .5s ease both}
.lock{transition:opacity .5s ease,transform .6s var(--ease)}
.lock.out{opacity:0;transform:scale(1.03)}
.nav{position:relative}
.nav-ind{position:absolute;left:0;right:0;top:0;height:42px;border-radius:10px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .5s cubic-bezier(.3,1.3,.4,1),height .3s;pointer-events:none}
.nav button{position:relative;z-index:1}
.nav button[aria-current="true"]{background:none}
.tab-ind{position:absolute;top:6px;left:0;border-radius:12px;background:rgba(255,255,255,.1);transition:transform .5s cubic-bezier(.3,1.3,.4,1),width .3s;pointer-events:none}
.tabbar{grid-template-columns:repeat(6,1fr)}
.tabbar button{z-index:1}
.tabbar button[aria-current="true"]{background:none}
.tabbar button svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tabbar button[aria-current="true"] svg{transform:translateY(-2px) scale(1.08);color:var(--band)}
.gear{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:var(--ice);color:var(--ink)}
.gear svg{width:18px;height:18px}
@media (min-width:980px){.gear{display:none}}
.scrim{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.drawer{transition:transform .55s cubic-bezier(.22,1,.36,1),visibility 0s .55s}
.drawer.on .dr-b>*{animation:rise .55s var(--ease) both;animation-delay:calc(120ms + var(--n,0)*55ms)}
.burst{position:absolute;left:50%;top:42%;z-index:5;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:var(--sign);display:grid;place-items:center;box-shadow:0 30px 60px -20px rgba(47,107,61,.6);animation:burst 1.15s var(--ease) forwards;pointer-events:none}
.burst svg{width:58px;height:58px}
.burst path{stroke-dasharray:60;stroke-dashoffset:60;animation:tick 0.45s .18s ease-out forwards}
@keyframes burst{0%{transform:scale(.4);opacity:0}22%{transform:scale(1.06);opacity:1}34%{transform:scale(1)}78%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
@keyframes tick{to{stroke-dashoffset:0}}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes grow{from{transform:scaleY(0)}}
.btn{transition:background-color .15s,transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.card{transition:box-shadow .3s}
/* today */
.hello{margin:0 0 24px}
.hello p{margin:0;font-size:clamp(20px,2.4vw,26px);line-height:1.4;max-width:30ch;color:var(--body)}
.hello b{color:var(--ink);font-weight:600}
.hello .hl{background:linear-gradient(transparent 62%,rgba(242,194,48,.55) 62%);padding:0 2px}
.sample{display:block;margin-top:14px;font-size:13.5px;color:var(--muted)}
.sample i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--band);margin-right:8px;vertical-align:1px}
.tasks{list-style:none;margin:0;padding:6px 8px 10px}
.tgs{padding:2px 0 6px}
.tg+.tg{border-top:1px solid var(--line);margin-top:4px}
.tg .tasks{padding:0 8px 8px}
.tg-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0;padding:16px 20px 6px;font-size:15px;font-weight:600;color:var(--ink)}
.tg-h>i{align-self:center;width:10px;height:10px;border-radius:50%;background:var(--tg)}
.tg-n{font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.tg-hint{font-size:13.5px;font-weight:400;color:var(--muted)}
.tg-reply{--tg:var(--ink);--tg-b:var(--ink);--tg-t:#fff}
.tg-price{--tg:var(--band);--tg-b:var(--band);--tg-t:var(--ink)}
.tg-pay{--tg:#5b85b3;--tg-b:#3f6a98;--tg-t:#fff}
.tg-deliver{--tg:var(--sign);--tg-b:var(--sign);--tg-t:#fff}
.tg .task>i{visibility:hidden}
.tg-h{padding-left:22px}
.tg .task .go em{background:var(--tg-b);color:var(--tg-t)}
.tg .task:hover .go em{background:var(--tg-b);filter:brightness(.92)}
@media (max-width:520px){.tg-hint{flex-basis:100%;padding-left:20px}.tg-h{padding:14px 14px 4px}}
.task{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 14px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:14px 12px;border-radius:12px;transition:background-color .2s,transform .2s var(--ease)}
.task:hover{background:var(--paper)}
.task>i{grid-row:1/3;width:10px;height:10px;border-radius:50%;background:var(--band)}
.task.k-confirmed>i{background:#5b85b3}.task.k-paid>i{background:var(--sign)}.task.k-quote>i{background:var(--ink)}
.task b{font-size:16px;font-weight:600}
.task .sub{grid-column:2;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .go{grid-row:1/3;grid-column:3;display:flex;align-items:center;gap:12px}
.task .go span{font-weight:600;font-variant-numeric:tabular-nums}
.task .go em{font-style:normal;font-size:13.5px;font-weight:600;background:var(--ink);color:#fff;border-radius:999px;padding:7px 13px;transition:background-color .2s}
.task:hover .go em{background:var(--sign)}
.wait{border-top:1px solid var(--line)}
.wait summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:14.5px;color:var(--muted)}
.wait summary::-webkit-details-marker{display:none}
.wait summary b{color:var(--ink);font-weight:600}
.wk{padding:18px 20px 0}
.wk span{font-size:13.5px;color:var(--muted)}
.wk b{display:block;font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1;margin:6px 0 4px;letter-spacing:.3px}
.wk small{font-size:13px}
.wk small.up{color:var(--sign)}.wk small.dn{color:var(--shell)}
@media (max-width:520px){.task .go span{display:none}.task{padding:13px 8px}}
/* stock rows */
.stk2{list-style:none;margin:0;padding:0}
.stk2>li+li{border-top:1px solid var(--line)}
.sr{display:grid;grid-template-columns:52px minmax(0,1fr) auto 36px;gap:14px;align-items:center;padding:14px 18px}
.sr img{width:52px;height:52px;border-radius:12px;object-fit:cover;transition:filter .3s,opacity .3s}
li.is-out .sr img{filter:grayscale(1);opacity:.55}
.sr b{display:block;font-size:16px;font-weight:600}
.sr small{display:block;font-size:13.5px;color:var(--muted);margin-top:1px}
.sr small em{font-style:normal;color:var(--shell-dk,#8a3214);font-weight:600}
.sx{width:36px;height:36px;border-radius:50%;border:0;background:var(--ice);display:grid;place-items:center;transition:transform .35s var(--ease),background-color .2s}
.sx svg{width:14px;height:14px}
li.open .sx{transform:rotate(180deg);background:var(--ink);color:#fff}
.st3{position:relative;isolation:isolate}
.st3 .th{position:absolute;z-index:-1;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--sign);transition:transform .45s cubic-bezier(.3,1.3,.4,1),width .3s,background-color .3s}
.st3[data-st="limited"] .th{background:var(--band)}.st3[data-st="out"] .th{background:var(--ink)}
.st3 button[aria-pressed="true"][data-st]{background:none!important}
.st3 button[aria-pressed="true"]{color:#fff!important}
.st3[data-st="limited"] button[aria-pressed="true"]{color:var(--ink)!important}
.sxp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
li.open .sxp{grid-template-rows:1fr}
.sxp>div{overflow:hidden}
.sxi{padding:0 18px 18px 84px;display:grid;gap:14px;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .4s var(--ease)}
li.open .sxi{opacity:1;transform:none;transition-delay:.08s}
@media (max-width:640px){.sr{grid-template-columns:44px minmax(0,1fr) 36px;row-gap:10px;padding:14px}.sr img{width:44px;height:44px}.sr .st3{grid-column:1/-1;grid-row:2;width:100%}.sr .st3 button{flex:1}.sxi{padding:0 14px 16px}}
.spc{display:flex;align-items:center;gap:16px;padding:16px 18px}
.spc .sp-prev{flex:1;min-width:0}
.spc-x{padding:0 18px 18px;display:grid;gap:12px}
/* website hint */
.pv-hint{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.pv-hint i{width:8px;height:8px;border-radius:50%;background:var(--band);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.field.flash input,.field.flash textarea{animation:fflash 1.2s ease}
@keyframes fflash{0%{box-shadow:0 0 0 4px var(--band)}100%{box-shadow:0 0 0 1px #d5dbd7}}
@media (prefers-reduced-motion:reduce){.enter>*,.drawer.on .dr-b>*,.chart .bar{animation:none}}

/* ===== advanced: search, board, prep, phone orders, why mode ===== */
.ck-open{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 12px;border-radius:10px;border:0;background:rgba(255,255,255,.06);color:#9fb0bd;font-size:14px;text-align:left;width:100%;transition:background-color .2s,color .2s}
.ck-open:hover{background:rgba(255,255,255,.1);color:#fff}
.ck-open svg{width:16px;height:16px}
.ck-open kbd{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;background:rgba(255,255,255,.08);border-radius:5px;padding:2px 6px}
.cmdk{position:fixed;inset:0;z-index:90;background:rgba(19,32,46,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;justify-items:center;align-items:start;padding:12vh 14px 14px;animation:fadein .2s ease}
.ck-box{width:min(640px,100%);background:#fff;border-radius:18px;box-shadow:0 40px 80px -30px rgba(19,32,46,.6),0 0 0 1px rgba(19,32,46,.06);overflow:hidden;animation:ckIn .35s cubic-bezier(.2,1.2,.3,1) both}
@keyframes ckIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
.ck-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.ck-in svg{width:18px;height:18px;color:var(--muted);flex:none}
.ck-in input{flex:1;border:0;font-size:17px;outline:none;background:none}
.ck-list{list-style:none;margin:0;padding:8px;max-height:min(56vh,460px);overflow:auto}
.ck-list li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer}
.ck-list li[aria-selected="true"]{background:var(--paper)}
.ck-list .ci{grid-row:1/3;width:34px;height:34px;border-radius:9px;background:var(--ice);display:grid;place-items:center;overflow:hidden;color:var(--ink)}
.ck-list .ci img{width:100%;height:100%;object-fit:cover}
.ck-list .ci svg{width:17px;height:17px}
.ck-list b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-list small{grid-column:2;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-list .k{grid-row:1/3;grid-column:3;font-size:12px;color:var(--muted)}
.ck-list li.ckg{display:block;padding:10px 10px 4px;font-size:12px;font-weight:600;color:var(--muted);cursor:default;background:none}
.ck-foot{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.ck-foot kbd{font-family:var(--f-mono);background:var(--ice);border-radius:5px;padding:1px 6px;margin-right:4px}
.tb-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:var(--ice);color:var(--ink)}
.tb-ic svg{width:17px;height:17px}
@media (min-width:980px){.tb-ic{display:none}}
/* board */
/* orders: days */
.dnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.dnav p{margin:0;font-size:14px}
.dnav>div{display:flex;align-items:center;gap:6px}
.dn-b,.dn-t{border:0;background:#fff;box-shadow:0 0 0 1px var(--line);border-radius:999px;height:36px;display:grid;place-items:center;color:var(--ink);font-weight:600;font-size:14px}
.dn-b{width:36px}.dn-b svg{width:16px;height:16px}.dn-t{padding:0 16px}

/* ===== premium motion: press physics, sheen, busy and done states, sliding thumbs ===== */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1)}
.btn{position:relative;overflow:hidden;isolation:isolate;transition:background-color .25s,color .25s,box-shadow .25s,transform .55s var(--spring)}
.btn:hover{transform:none}
.btn:active:not(:disabled){transform:scale(.96);transition-duration:.25s,.25s,.25s,.09s;transition-timing-function:ease,ease,ease,ease-out}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(140px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.2),transparent 65%);opacity:0;transition:opacity .35s}
.btn.b-band::before{background:radial-gradient(140px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.45),transparent 65%)}
.btn.b-soft::before,.btn.b-ghost::before{background:radial-gradient(120px circle at var(--mx,50%) var(--my,50%),rgba(19,32,46,.06),transparent 65%)}
@media (hover:hover){.btn:hover::before{opacity:1}}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--sign)}
.btn .bl{display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .45s var(--out),opacity .25s}
.btn .bx{position:absolute;inset:0;display:grid;place-items:center;transform:translateY(110%);opacity:0;transition:transform .45s var(--out),opacity .25s}
.btn.busy,.btn.ok{pointer-events:none}
.btn.busy .bl,.btn.ok .bl{transform:translateY(-110%);opacity:0}
.btn.busy .bx,.btn.ok .bx{transform:none;opacity:1}
.bx .spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;opacity:.85;animation:spin .7s linear infinite}
.bx svg{display:none;width:20px;height:20px}
.btn.ok{background:var(--sign)!important;color:#fff!important}
.btn.ok .spin{display:none}.btn.ok .bx svg{display:block}
.btn.ok .bx path{stroke-dasharray:24;stroke-dashoffset:24;animation:tick .45s var(--out) .05s forwards}

/* rows, chips and controls press in, spring back */
.task,.seg button,.segm button,.st3 button,.nav button,.ck-open,.why-tog,.dr-x,.tabbar button{transition-property:background-color,color,box-shadow,transform;transition-duration:.25s,.25s,.25s,.5s;transition-timing-function:ease,ease,ease,var(--spring)}

/* ---------- orders: days view (by day needed) ---------- */
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function whenDate(o){const w=String(o.when||"").trim();let m=w.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);
  m=w.match(/\b([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2})(?!\d)/);if(m&&MON[m[1].toLowerCase()]!=null){const a=new Date(o.at||Date.now());const d=new Date(a.getFullYear(),MON[m[1].toLowerCase()],+m[2]);if(+d<+a-120*DAY)d.setFullYear(d.getFullYear()+1);return d}return null}
const whenTxt=o=>{const d=whenDate(o);return d?d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}):(o.when||"Not set")};
const DACT={new:["price","Price it"],confirmed:["pay","Collect payment"],paid:["deliver","Deliver"]};

  const qcard=x=>`<button class="dc" type="button" data-quote="${esc(x.id)}"><span class="dc-t"><b>${esc(x.biz||x.name)}</b><span class="tag ws">Wholesale</span></span><span class="dc-i">${esc(x.need)}</span><span class="dc-f"><span class="dc-h">${esc([x.when,x.freq].filter(Boolean).join(" · "))}</span>${x.status==="new"?`<em class="dc-a tg-reply">Reply</em>`:""}</span></button>`;
  const panel=(k,list,quotes)=>{const d=k?new Date(k+"T12:00"):null,diff=d?Math.round((d-d0-12*36e5)/DAY):0;

  box.innerHTML=`<div class="dnav"><p class="muted">One panel per day, by the day the customer needs it.</p><div><button type="button" class="dn-b" data-dn="-1" aria-label="Earlier days"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="dn-t" data-dn="0">Today</button><button type="button" class="dn-b" data-dn="1" aria-label="Later days"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>

let oDate=(()=>{try{return JSON.parse(sessionStorage.getItem("ot-odate"))||{k:"any"}}catch(e){return{k:"any"}}})();
const DPRE=[["any","Any date"],["today","Today"],["7","Last 7 days"],["30","Last 30 days"],["month","This month"],["last","Last month"]];
function dRange(){const k=oDate.k,now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),end=new Date(+d0+DAY);
  if(k==="today")return[d0,end];if(k==="7")return[new Date(+d0-6*DAY),end];if(k==="30")return[new Date(+d0-29*DAY),end];
  if(k==="month")return[new Date(now.getFullYear(),now.getMonth(),1),end];if(k==="last")return[new Date(now.getFullYear(),now.getMonth()-1,1),new Date(now.getFullYear(),now.getMonth(),1)];
  if(k==="custom"){const a=oDate.from?new Date(oDate.from+"T00:00"):new Date(0),b=oDate.to?new Date(+new Date(oDate.to+"T00:00")+DAY):new Date(8.64e15);return[a,b]}return null}
const inDates=at=>{const r=dRange();if(!r)return true;const t=new Date(at);return t>=r[0]&&t<r[1]};

const iso10=d=>new Date(+d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);

      <button type="button" class="btn b-ink b-sm dp-go" id="dpGo">Show these dates</button></div></div>`}
function dpSet(v){oDate=v;try{sessionStorage.setItem("ot-odate",JSON.stringify(v))}catch(e){}const w=$("dpick");if(!w)return;w.outerHTML=dpHTML();dpWire();drawOrders();softSwap($("olist"))}

function busyBtn(b){

  const t0=performance.now();b.classList.remove("ok");b.classList.add("busy");b.setAttribute("aria-busy","true");

function segThumb(g){const b=g.querySelector(":scope>button[aria-pressed=true]");if(!b)return;

  if(!b.offsetWidth)return;t.style.width=b.offsetWidth+"px";t.style.transform=`translateX(${b.offsetLeft}px)`;SEGPOS[key]={x:b.offsetLeft,w:b.offsetWidth}}

function rowKey(e){return (e.dataset.order||e.dataset.quote||e.dataset.chat||e.dataset.bc||e.dataset.sid||"")+"|"+e.tagName+"|"+(e.closest("table")?"t":e.closest(".board")?"b":"c")}
function flip(fn,root){root=root||$("page");if(RM.matches||!root){fn();return}
  const sel="[data-order],[data-quote],[data-chat],[data-bc],[data-sid]",before=new Map();
  root.querySelectorAll(sel).forEach(e=>{if(!e.offsetParent)return;const r=e.getBoundingClientRect();if(r.bottom<-40||r.top>innerHeight+40)return;before.set(rowKey(e),{r,e})});
  const gone=[];before.forEach((v,k)=>gone.push([k,v]));
  fn();

  if(!LIVE)addEventListener("storage",e=>{if(e.key==="ot-chats")pollChats()});
  setInterval(pollChats,LIVE?12000:5000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pollChats()});
  if(LIVE)setInterval(async()=>{if(document.hidden||OPEN)return;try{const before=DB.orders.filter(o=>o.status==="new").length;await loadAll();const after=DB.orders.filter(o=>o.status==="new").length;if(after>before){toast(`<b>${after-before}</b> new order${after-before>1?"s":""}`);chime()}drawNav();if(["today","orders"].includes(route))render()}catch(e){}},60000);
}
function lock(){sessionStorage.removeItem("ot-pin");PIN="";location.hash="";location.reload()}
$("lockBtn").onclick=lock;
$("lockForm").onsubmit=e=>e.preventDefault();
(async function boot(){
  if(!LIVE)$("demoHint").hidden=false;
  const saved=sessionStorage.getItem("ot-pin");
  if(saved){try{PIN=saved;if(!LIVE&&saved!==LS.get("ot-admin-pin",CFG.demoPin))throw 0;await loadAll();enter();return}catch(e){PIN="";sessionStorage.removeItem("ot-pin")}}
  pinBoxes[0].focus();
})();
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(!$("app").hidden&&h&&h!==route&&T[h]){setRoute(h);render()}});
addEventListener("beforeunload",e=>{if(dirtyCount()){e.preventDefault();e.returnValue=""}});
</script>
